<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation</title>
    <link rel="stylesheet" type="text/css" href="css/normalize.css"/>
    <link rel="stylesheet" type="text/css" href="css/base.css"/>
    <link rel="stylesheet" type="text/css" href="css/main.css"/>
    <script type="text/javascript" src="js/modernizr.custom.js"></script>
</head>
<body>
    <div class="wrap">
        <div class="box">
            <section id="search">
            <!--songhong_2014_11_10_modification-->
                <div id="searchbox"  target="_blank" method="get">
                    <input type="text" id="search_text"  name="q" size=40 class="search-text" value="" placeholder="Google Search" autofocus>
                    <input type="submit" class="search-submit" value="" title="Google" onclick="getFormInfo();">
                </div>
            </section>
            <section id="content">
                <ul id="list-app">
                    <li>
                        <a href="http://www.twitter.com/" class="app-cut" onfocus="return txtFocus();" onblur="return txtBlur();">
                            <img src="img/twitter.png" alt="tv-app"></a>
                    </li>
                    <li>
                        <a href="http://www.google.com/" class="app-cut" onfocus="return txtFocus();" onblur="return txtBlur();">
                            <img src="img/google.png" alt="tv-app"></a>
                    </li>
                    <li>
                        <a href="http://www.facebook.com/" class="app-cut" onfocus="return txtFocus();" onblur="return txtBlur();">
                            <img src="img/facebook.png" alt="tv-app"></a>
                    </li>
                    <li>
                        <a href="http://www.youtube.com/" class="app-cut" onfocus="return txtFocus();" onblur="return txtBlur();">
                            <img src="img/youtube.png" alt="tv-app"></a>
                    </li>
                    <li>
                        <a href="http://mail.google.com/" class="app-cut" onfocus="return txtFocus();" onblur="return txtBlur();">
                            <img src="img/gmail.png" alt="tv-app"></a>
                    </li>
                    <li>
                        <a href="https://www.netflix.com/" class="app-cut" onfocus="return txtFocus();" onblur="return txtBlur();">
                            <img src="img/netflix.png" alt="tv-app"></a>
                    </li>
                </ul>
            </section>
            <table height=600 border="0" cellspacing="0" cellpadding="0">
            </table>
        </div>
    </div>
</body>
</html>
